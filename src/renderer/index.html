<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>ZapMirror</title>
    <style>
      body { font-family: system-ui, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 24px; }
      h1 { font-size: 18px; }
      #devices { margin-top: 16px; display: flex; flex-direction: column; gap: 8px; }
      .device { padding: 8px 12px; border: 1px solid #334155; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
      .device button { cursor: pointer; }
      #mirror { margin-top: 20px; display: none; }
      #mirror.active { display: block; }
      #screen { max-width: 100%; border: 1px solid #334155; background: #000; cursor: pointer; }
      #status { font-size: 13px; opacity: 0.8; margin-top: 8px; }
    </style>
  </head>
  <body>
    <h1>ZapMirror</h1>
    <div id="devices">Nenhum dispositivo detectado ainda. Conecte um Android por USB e autorize a depuração no aparelho.</div>
    <div id="mirror">
      <canvas id="screen" tabindex="0"></canvas>
      <div id="status"></div>
    </div>
    <script src="./main.js"></script>
  </body>
</html>
